# Durable-acknowledgement checks through the block layer (bench/durability/dlw.py,
# docs/DIRECTION_COMPARISON_PLAN.md 4.1). GitHub-hosted VMs have device-mapper;
# the cloud dev containers do not. Runs when the harness changes, or on demand.
name: durability

on:
  pull_request:
    paths: ["bench/durability/**", "bench/net_bench.cpp", "bench/resp_bench.cpp", "bench/garnet/**", "tests/test_resp_bench.py", ".github/workflows/durability.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Device-mapper and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dmsetup "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -q dmsetup
          sudo modprobe dm-log-writes
          uname -r; sudo dmsetup targets
      - name: Controls (positive must pass, negative must fail)
        run: sudo python3 bench/durability/dlw.py controls --build-replay-log

  snc:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Device-mapper, tools and build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dmsetup libmimalloc-dev libxxhash-dev liburing-dev "linux-modules-extra-$(uname -r)" \
            || sudo apt-get install -y -q dmsetup libmimalloc-dev libxxhash-dev liburing-dev
          sudo modprobe dm-log-writes
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j "$(nproc)" --target snc_server net_bench
      - name: snc_server acknowledged writes survive every mark
        run: |
          B="$PWD/build"; S=bench/durability/snc.py; A=/var/tmp/dlw/acks
          sudo python3 bench/durability/dlw.py run --build-replay-log --size-mb 1024 \
            --check "python3 $S check $B $A 2 20000 1000000000" -- \
            python3 $S load "$B" $A 2 20000 --threads 2 --objects 3000 --rate 2000 --seconds 14 \
            --transfer 50 --reads 20 --xfer-local 0 --start-balance 1000000000
      - name: Keep the ack log and server log
        if: failure()
        run: sudo chmod -R a+rX /var/tmp/dlw || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snc-durability
          path: |
            /var/tmp/dlw/acks
            /var/tmp/dlw/server.log

  resp-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: .NET and build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0 libmimalloc-dev libxxhash-dev liburing-dev
      - name: Build
        run: |
          dotnet build -c Release bench/garnet
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j "$(nproc)" --target resp_bench
      - name: Settlement probe on Garnet
        run: python3 tests/test_resp_bench.py build bench/garnet/bin/Release/net10.0/SncGarnet

  garnet:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Expected from bench/results/dc1-trackb/GARNET_DURABILITY.md: Native and
        # RandomAccess never flush, so they must fail (a second negative control);
        # FileStream writes O_SYNC and must pass. Any other outcome fails the job.
        include:
          - {device: Native, expect: lose}
          - {device: FileStream, expect: pass}
          - {device: RandomAccess, expect: lose}
    steps:
      - uses: actions/checkout@v4
      - name: Device-mapper, .NET and build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dmsetup dotnet-sdk-10.0 libmimalloc-dev libxxhash-dev liburing-dev "linux-modules-extra-$(uname -r)" \
            || sudo apt-get install -y -q dmsetup dotnet-sdk-10.0 libmimalloc-dev libxxhash-dev liburing-dev
          sudo modprobe dm-log-writes
      - name: Build
        run: |
          dotnet build -c Release bench/garnet
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j "$(nproc)" --target resp_bench
      - name: Garnet ${{ matrix.device }} durability (expected ${{ matrix.expect }})
        run: |
          G="$PWD/bench/garnet/bin/Release/net10.0/SncGarnet"; S=bench/durability/garnet.py; A=/var/tmp/dlw/acks
          set +e
          sudo python3 bench/durability/dlw.py run --build-replay-log --size-mb 1024 \
            --check "python3 $S check $G $A ${{ matrix.device }} 1000000000" -- \
            python3 $S load "$G" "$PWD/build/resp_bench" $A ${{ matrix.device }} --threads 2 --conns 2 \
            --objects 3000 --rate 2000 --seconds 16 --warmup 2 --transfer 50 --reads 20 --start-balance 1000000000 \
            --probe-pct 5 --probe-slo-us 100000 \
            | tee /var/tmp/dlw-result.txt
          rc=${PIPESTATUS[0]}
          r=$(tail -1 /var/tmp/dlw-result.txt)
          echo "$r"
          if [ "${{ matrix.expect }}" = pass ]; then
            [ "$rc" = 0 ]
          else
            # Must lose writes at some mark, with every negative control still rejected.
            echo "$r" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r["failed"] and not r["negative"]["not_rejected"] and r["rc"] == 0 else 1)'
          fi
      - name: Keep the ack log and server log
        if: failure()
        run: sudo chmod -R a+rX /var/tmp/dlw || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: garnet-durability-${{ matrix.device }}
          path: |
            /var/tmp/dlw/acks
            /var/tmp/dlw/server.log
